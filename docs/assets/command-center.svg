<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">SOUNDCLOUD OPEN command-center overview</title><desc id="desc">AUTHORIZED LINK to YT-DLP CORE to ART + METADATA to ORGANIZED FILES</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#15103b"/><stop offset="1" stop-color="#03040b"/></radialGradient>
 <linearGradient id="neon"><stop stop-color="#ff8a00"/><stop offset=".48" stop-color="#ff2bd6"/><stop offset="1" stop-color="#6cf6ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#6cf6ff" stroke-opacity=".08"/></pattern>
 <style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif}.orbit{transform-origin:600px 265px;animation:spin 18s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.dash{stroke-dasharray:12 12;animation:dash 1.5s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45}}@keyframes dash{to{stroke-dashoffset:-48}}
 @media(prefers-reduced-motion:reduce){.orbit,.pulse,.dash{animation:none}}
 </style>
</defs>
<rect width="1200" height="500" rx="28" fill="url(#bg)"/><rect width="1200" height="500" rx="28" fill="url(#grid)"/>
<path d="M40 30H300M900 30h260M40 470h260M900 470h260" stroke="url(#neon)" stroke-width="3" opacity=".8"/>
