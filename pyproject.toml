[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundcloudopen"
version = "1.2.0"
description = "Creator-owned SoundCloud workflow with XUNIA SOUNDS, Claude MCP, BeatStars intelligent discovery, and VIRGINIA mission planning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "sonoxo"}]
keywords = ["soundcloud", "yt-dlp", "playlist", "artwork", "audio", "beatstars", "claude", "mcp", "virginia"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = ["yt-dlp>=2025.1.1"]

[project.scripts]
soundcloudopen = "soundcloudopen.cli:main"
sco = "soundcloudopen.cli:main"
xunia-sounds = "soundcloudopen.xunia_sounds:main"
xuniasounds = "soundcloudopen.xunia_sounds:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
